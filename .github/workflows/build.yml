name: Build TV Remote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create TV Remote App Code
        run: |
          mkdir -p app/src/main/java/com/example/tvremote
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TVRemote"
          include ':app'
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              namespace 'com.example.tvremote'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tvremote"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "2.5"
              }
          }

          dependencies {
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Smart TV Controller"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/example/tvremote/MainActivity.java
          package com.example.tvremote;

          import android.app.Activity;
          import android.content.Context;
          import android.net.wifi.WifiManager;
          import android.os.Bundle;
          import android.text.format.Formatter;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private EditText ipInput;
              private TextView statusText;
              private OutputStream out;
              private final ExecutorService executor = Executors.newFixedThreadPool(12);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scrollView = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("Smart TV Remote Control");
                  title.setTextSize(22);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  statusText = new TextView(this);
                  statusText.setText("Status: Disconnected");
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 10, 0, 20);
                  root.addView(statusText);

                  // Connection Bar
                  LinearLayout connLayout = new LinearLayout(this);
                  ipInput = new EditText(this);
                  ipInput.setHint("TV IP Address");
                  ipInput.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));

                  Button btnScan = new Button(this);
                  btnScan.setText("Auto Scan");
                  btnScan.setOnClickListener(v -> scanSubnet());

                  Button btnConnect = new Button(this);
                  btnConnect.setText("Connect");
                  btnConnect.setOnClickListener(v -> connectToTv(ipInput.getText().toString().trim()));

                  connLayout.addView(ipInput);
                  connLayout.addView(btnScan);
                  connLayout.addView(btnConnect);
                  root.addView(connLayout);

                  // Navigation Section
                  root.addView(makeHeader("D-Pad Navigation"));
                  root.addView(makeBtn("▲ UP", v -> sendKey("KEYCODE_DPAD_UP")));

                  LinearLayout midDpad = new LinearLayout(this);
                  midDpad.addView(makeFlexBtn("◄ LEFT", v -> sendKey("KEYCODE_DPAD_LEFT")));
                  midDpad.addView(makeFlexBtn("SELECT", v -> sendKey("KEYCODE_DPAD_CENTER")));
                  midDpad.addView(makeFlexBtn("RIGHT ►", v -> sendKey("KEYCODE_DPAD_RIGHT")));
                  root.addView(midDpad);

                  root.addView(makeBtn("▼ DOWN", v -> sendKey("KEYCODE_DPAD_DOWN")));

                  // Essential Controls
                  root.addView(makeHeader("System & Volume"));
                  LinearLayout sysRow = new LinearLayout(this);
                  sysRow.addView(makeFlexBtn("BACK", v -> sendKey("KEYCODE_BACK")));
                  sysRow.addView(makeFlexBtn("HOME", v -> sendKey("KEYCODE_HOME")));
                  sysRow.addView(makeFlexBtn("MUTE", v -> sendKey("KEYCODE_VOLUME_MUTE")));
                  root.addView(sysRow);

                  LinearLayout volRow = new LinearLayout(this);
                  volRow.addView(makeFlexBtn("VOL -", v -> sendKey("KEYCODE_VOLUME_DOWN")));
                  volRow.addView(makeFlexBtn("VOL +", v -> sendKey("KEYCODE_VOLUME_UP")));
                  root.addView(volRow);

                  // Media Controls
                  root.addView(makeHeader("Media Playback"));
                  LinearLayout mediaRow = new LinearLayout(this);
                  mediaRow.addView(makeFlexBtn("◄◄ REV", v -> sendKey("KEYCODE_MEDIA_REWIND")));
                  mediaRow.addView(makeFlexBtn("►|| PLAY/PAUSE", v -> sendKey("KEYCODE_MEDIA_PLAY_PAUSE")));
                  mediaRow.addView(makeFlexBtn("FF ►►", v -> sendKey("KEYCODE_MEDIA_FAST_FORWARD")));
                  root.addView(mediaRow);

                  // App Shortcuts
                  root.addView(makeHeader("Quick App Launchers"));
                  LinearLayout appRow1 = new LinearLayout(this);
                  appRow1.addView(makeFlexBtn("YouTube", v -> launchApp("com.google.android.youtube.tv")));
                  appRow1.addView(makeFlexBtn("Netflix", v -> launchApp("com.netflix.ninja")));
                  root.addView(appRow1);

                  LinearLayout appRow2 = new LinearLayout(this);
                  appRow2.addView(makeFlexBtn("Prime Video", v -> launchApp("com.amazon.amazonvideo.livingroom")));
                  appRow2.addView(makeFlexBtn("Spotify", v -> launchApp("com.spotify.tv.android")));
                  root.addView(appRow2);

                  // Power Section
                  root.addView(makeHeader("Power Options"));
                  LinearLayout powerRow = new LinearLayout(this);
                  powerRow.addView(makeFlexBtn("POWER TOGGLE", v -> sendKey("KEYCODE_POWER")));
                  powerRow.addView(makeFlexBtn("REBOOT TV", v -> sendCommand("reboot\n")));
                  root.addView(powerRow);

                  scrollView.addView(root);
                  setContentView(scrollView);
              }

              private TextView makeHeader(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(15);
                  tv.setPadding(0, 25, 0, 10);
                  return tv;
              }

              private Button makeBtn(String text, View.OnClickListener listener) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setOnClickListener(listener);
                  return b;
              }

              private Button makeFlexBtn(String text, View.OnClickListener listener) {
                  Button b = makeBtn(text, listener);
                  b.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1));
                  return b;
              }

              private void scanSubnet() {
                  statusText.setText("Scanning network for TV...");
                  WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                  String ip = Formatter.formatIpAddress(wm.getConnectionInfo().getIpAddress());
                  if (ip.equals("0.0.0.0")) {
                      statusText.setText("Connect to Wi-Fi first!");
                      return;
                  }
                  String prefix = ip.substring(0, ip.lastIndexOf(".") + 1);

                  for (int i = 1; i < 255; i++) {
                      final String targetIp = prefix + i;
                      executor.execute(() -> {
                          try {
                              Socket socket = new Socket();
                              socket.connect(new InetSocketAddress(targetIp, 5555), 150);
                              socket.close();
                              runOnUiThread(() -> {
                                  ipInput.setText(targetIp);
                                  statusText.setText("TV Discovered: " + targetIp);
                                  connectToTv(targetIp);
                              });
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void connectToTv(String ip) {
                  executor.execute(() -> {
                      try {
                          Socket socket = new Socket();
                          socket.connect(new InetSocketAddress(ip, 5555), 2000);
                          out = socket.getOutputStream();
                          runOnUiThread(() -> statusText.setText("Connected to: " + ip));
                      } catch (Exception e) {
                          runOnUiThread(() -> statusText.setText("Connection failed: " + e.getMessage()));
                      }
                  });
              }

              private void sendKey(String keycode) {
                  sendCommand("shell:input keyevent " + keycode + "\n");
              }

              private void launchApp(String pkg) {
                  sendCommand("shell:monkey -p " + pkg + " -c android.intent.category.LAUNCHER 1\n");
              }

              private void sendCommand(String cmd) {
                  if (out == null) {
                      Toast.makeText(this, "Connect to TV first!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  executor.execute(() -> {
                      try {
                          out.write(cmd.getBytes());
                          out.flush();
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "Error sending command", Toast.LENGTH_SHORT).show());
                      }
                  });
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-App
          path: app/build/outputs/apk/debug/app-debug.apk