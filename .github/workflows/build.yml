name: Build Android TV Remote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Native Android Project
        run: |
          mkdir -p app/src/main/java/com/example/tvremote
          mkdir -p app/src/main/res/layout

          # Create settings.gradle
          echo "rootProject.name = 'TVRemote'" > settings.gradle

          # Create root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # Create app build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.example.tvremote'
              defaultConfig {
                  applicationId "com.example.tvremote"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # Create AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="TV Remote"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java (Pure Android Native Code)
          cat << 'EOF' > app/src/main/java/com/example/tvremote/MainActivity.java
          package com.example.tvremote;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Toast;
          import android.widget.LinearLayout;
          import java.io.OutputStream;
          import java.net.Socket;

          public class MainActivity extends Activity {
              private EditText ipInput;
              private Socket socket;
              private OutputStream out;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(32, 32, 32, 32);

                  ipInput = new EditText(this);
                  ipInput.setHint("Enter TV IP Address");
                  layout.addView(ipInput);

                  Button btnConnect = new Button(this);
                  btnConnect.setText("Connect to TV");
                  btnConnect.setOnClickListener(v -> connect());
                  layout.addView(btnConnect);

                  String[] keys = {"KEYCODE_DPAD_UP", "KEYCODE_DPAD_LEFT", "KEYCODE_DPAD_CENTER", "KEYCODE_DPAD_RIGHT", "KEYCODE_DPAD_DOWN", "KEYCODE_BACK", "KEYCODE_HOME"};
                  String[] labels = {"Up", "Left", "OK", "Right", "Down", "Back", "Home"};

                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button btn = new Button(this);
                      btn.setText(labels[i]);
                      btn.setOnClickListener(v -> sendKey(key));
                      layout.addView(btn);
                  }

                  setContentView(layout);
              }

              private void connect() {
                  new Thread(() -> {
                      try {
                          socket = new Socket(ipInput.getText().toString().trim(), 5555);
                          out = socket.getOutputStream();
                          runOnUiThread(() -> Toast.makeText(this, "Connected!", Toast.LENGTH_SHORT).show());
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "Connection Failed: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }

              private void sendKey(String keycode) {
                  if (out == null) {
                      Toast.makeText(this, "Connect to TV first", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  new Thread(() -> {
                      try {
                          String cmd = "shell:input keyevent " + keycode + "\n";
                          out.write(cmd.getBytes());
                          out.flush();
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }).start();
              }
          }
          EOF

      - name: Build Android Release APK
        run: |
          gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-App
          path: app/build/outputs/apk/release/app-release-unsigned.apk
